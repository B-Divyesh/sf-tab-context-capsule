<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081c25" />
    <title>Tab Context Capsule</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to capsule controls</a>
    <header class="masthead">
      <a class="brand" href="https://tab-context-capsule.sociobot.in" target="_blank" rel="noreferrer" aria-label="Tab Context Capsule website">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><b>Tab Context</b><strong>Capsule</strong></span>
      </a>
      <p class="privacy-signal"><span aria-hidden="true">●</span> Local only</p>
    </header>
    <h1 class="sr-only">Tab Context Capsule</h1>
    <nav class="route-tabs" aria-label="Capsule routes">
      <button type="button" data-route="capture" aria-current="page"><span>01</span> Capture</button>
      <button type="button" data-route="library"><span>02</span> Library <b id="capsule-count">0</b></button>
      <button type="button" data-route="unlock"><span>03</span> Conductor</button>
    </nav>
    <main id="main" tabindex="-1">
      <div class="loading-state" id="loading" role="status"><span class="rail-loader" aria-hidden="true"></span> Reading this window…</div>
      <section id="capture-view" class="view" aria-labelledby="capture-title" hidden></section>
      <section id="library-view" class="view" aria-labelledby="library-title" hidden></section>
      <section id="unlock-view" class="view" aria-labelledby="unlock-title" hidden></section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
